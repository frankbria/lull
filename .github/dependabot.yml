# Dependabot version updates with supply-chain cooldown stepdown:
# npm waits 7d (minor/patch) / 14d (major); uv and github-actions 14d flat
# (Dependabot rejects semver-* cooldown keys for github-actions).
# Security-advisory updates bypass cooldown (GitHub behavior).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
